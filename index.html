<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html lang="ja">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>メンタレジ 売上管理システム</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="wrap">
<div id="header"></div>
<div id="gnav"></div>
<div id="main">

<div class="pankuzu">ホーム</div>
<h2 class="ttl">トップページ</h2>

<div class="notice">
<b>【お知らせ】</b><br>
・2026/09/01　9月分の消費税区分マスタを更新しました。<br>
・2026/08/20　サーバメンテナンスのため 9/14(月) 2:00〜5:00 は本システムをご利用いただけません。<br>
・2026/07/03　Internet Explorer 以外のブラウザでは一部レイアウトが崩れる場合がございます。
</div>

<h3 class="sub">■ 本日の速報（2026-08-31）</h3>
<table class="list" id="today"></table>

<h3 class="sub">■ 直近5日間の売上</h3>
<table class="list" id="recent"></table>

<h3 class="sub">■ よく使うメニュー</h3>
<ul>
<li><a href="sales.html">売上明細を検索する</a></li>
<li><a href="daily.html">日別の売上を集計する</a></li>
<li><a href="items.html">商品別の売上を確認する</a></li>
<li><a href="staff.html">スタッフ別の売上を確認する</a></li>
</ul>

</div>
<div id="footer"></div>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
renderFrame('top');

var LAST = '2026-08-31';

function aggDate(date) {
  var r = { count: 0, total: 0, cust: 0 };
  for (var i = 0; i < SALES.length; i++) {
    if (SALES[i].date !== date || SALES[i].status === '返品') continue;
    r.count++; r.total += SALES[i].total; r.cust += SALES[i].customers;
  }
  return r;
}

var h = '<tr><th>店舗</th><th>伝票枚数</th><th>客数</th><th>売上金額</th><th>客単価</th></tr>';
var tc = 0, tt = 0, tu = 0;
for (var i = 0; i < STORES.length; i++) {
  var st = STORES[i], c = 0, t = 0, u = 0;
  for (var j = 0; j < SALES.length; j++) {
    var s = SALES[j];
    if (s.date !== LAST || s.store !== st.code || s.status === '返品') continue;
    c++; t += s.total; u += s.customers;
  }
  tc += c; tt += t; tu += u;
  h += '<tr' + (i % 2 ? ' class="even"' : '') + '><td>' + st.code + '：' + st.name + '</td>' +
       '<td class="num">' + num(c) + '</td><td class="num">' + num(u) + '</td>' +
       '<td class="num">' + yen(t) + '</td><td class="num">' + yen(Math.round(t / u)) + '</td></tr>';
}
h += '<tr><th>合計</th><th style="text-align:right">' + num(tc) + '</th><th style="text-align:right">' + num(tu) +
     '</th><th style="text-align:right">' + yen(tt) + '</th><th style="text-align:right">' + yen(Math.round(tt / tu)) + '</th></tr>';
document.getElementById('today').innerHTML = h;

var h2 = '<tr><th>日付</th><th>伝票枚数</th><th>客数</th><th>売上金額</th></tr>';
var dates = [];
for (var d = 27; d <= 31; d++) dates.push('2026-08-' + d);
for (var k = 0; k < dates.length; k++) {
  var a = aggDate(dates[k]);
  h2 += '<tr' + (k % 2 ? ' class="even"' : '') + '><td>' + dates[k] + '</td>' +
        '<td class="num">' + num(a.count) + '</td><td class="num">' + num(a.cust) + '</td>' +
        '<td class="num">' + yen(a.total) + '</td></tr>';
}
document.getElementById('recent').innerHTML = h2;
</script>
</body>
</html>
