<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html lang="ja">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>売上明細 | メンタレジ 売上管理システム</title>
<link rel="stylesheet" href="assets/style.css">
<script>(function(){try{if(!sessionStorage.getItem('mreji_login'))location.replace('index.html');}catch(e){location.replace('index.html');}})();</script>
</head>
<body>
<div id="wrap">
<div id="header"></div>
<div id="gnav"></div>
<div id="main">

<div class="pankuzu">ホーム &gt; 売上明細</div>
<h2 class="ttl">売上明細検索</h2>

<form id="f" action="sales.html" method="get">
<table class="search">
<tr>
  <th>対象支店</th>
  <td colspan="3" id="storecell"></td>
</tr>
<tr>
  <th>売上日</th>
  <td><input type="text" name="from" id="from" size="12" value=""> 〜 <input type="text" name="to" id="to" size="12" value="">
      <span style="color:#888">（例：2026-08-01　※半角で入力してください）</span></td>
  <th>支払方法</th>
  <td><select name="payment" id="payment"></select></td>
</tr>
<tr>
  <th>キーワード</th>
  <td><input type="text" name="keyword" id="keyword" size="20" value=""><span style="color:#888">（伝票番号／商品名／担当者）</span></td>
  <th>表示件数</th>
  <td>
    <select name="per" id="per">
      <option value="50">50件</option>
      <option value="100">100件</option>
      <option value="200">200件</option>
    </select>
    &nbsp;<input type="submit" class="btn" value="検 索">
    &nbsp;<input type="button" class="btn" value="ク リ ア" onclick="location.href='sales.html'">
  </td>
</tr>
</table>
</form>

<div class="hitnum" id="hit"></div>
<div class="pager" id="pager1"></div>
<table class="list" id="list"></table>
<div id="nodata" style="display:none;padding:16px;text-align:center;color:#888;border:1px solid #c3c9d2;border-top:none;">該当するデータがありません。</div>
<div class="pager" id="pager2"></div>

<p style="font-size:11px;color:#888;">
※本画面の一覧はCSV出力に対応しておりません。データが必要な場合は本部システム課へ依頼票をご提出ください。<br>
※本画面で表示できるのは先頭10ページまでです。それ以降は売上日を絞り込んで検索してください。<br>
※返品伝票は数量・金額をマイナスで表示しています。<br>
※他支店のデータは本画面では参照できません。
</p>

</div>
<div id="footer"></div>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
var ME = requireLogin();
if (ME) {
  renderFrame('sales', ME);
  document.getElementById('storecell').innerHTML = storeBadge(ME.store);

  var cond = {
    from: getParam('from') || '2026-08-01',
    to: getParam('to') || '2026-08-31',
    payment: getParam('payment'),
    keyword: getParam('keyword')
  };
  var per = parseInt(getParam('per') || '50', 10);
  var page = parseInt(getParam('p') || '1', 10);

  document.getElementById('from').value = cond.from;
  document.getElementById('to').value = cond.to;
  document.getElementById('payment').innerHTML = paymentOptions(cond.payment);
  document.getElementById('keyword').value = cond.keyword;
  document.getElementById('per').value = per;

  var MAX_PAGES = 10;                       /* 表示できるのは先頭10ページまで */
  var all = filterSales(cond, ME.store.code);
  var limit = per * MAX_PAGES;
  var over = all.length > limit;            /* 上限を超えたか */
  var rows = over ? all.slice(0, limit) : all;
  var maxPage = Math.max(1, Math.ceil(rows.length / per));
  if (page > maxPage) page = maxPage;
  var start = (page - 1) * per;
  var view = rows.slice(start, start + per);

  var hitHtml = '検索結果：<b>' + num(all.length) + '</b> 件中　' +
                num(start + 1) + ' 〜 ' + num(start + view.length) + ' 件を表示' +
                '　（全 ' + num(maxPage) + ' ページ中 ' + num(page) + ' ページ目）';
  if (over) {
    hitHtml += '<div style="border:1px solid #d9c98a;background:#fffbe6;color:#a06f00;' +
               'padding:5px 8px;margin-top:4px;">' +
               '検索結果が表示上限を超えています。本画面は <b>' + MAX_PAGES + ' ページ（' + num(limit) + ' 件）</b> までしか表示できません。' +
               '残り ' + num(all.length - limit) + ' 件を確認するには、売上日を絞り込むか表示件数を増やして再検索してください。' +
               '</div>';
  }
  document.getElementById('hit').innerHTML = hitHtml;

  function link(p) {
    return 'sales.html?from=' + cond.from + '&to=' + cond.to +
           '&payment=' + encodeURIComponent(cond.payment) + '&keyword=' + encodeURIComponent(cond.keyword) +
           '&per=' + per + '&p=' + p;
  }
  /* ページ番号は最大10個まで表示する（現在ページを中心にスライド） */
  /* ページャーは常に「先頭・前へ・ページ番号・次へ・最終」の5ブロックを出す。
     使えないときは a ではなく span になるだけで、要素の並びは変わらない。
     ページ送りの自動化では id（pgFirst / pgPrev / pgNext / pgLast）で拾える。 */
  /* 送りボタンは href にページ番号を入れず、クリック時に飛び先を決める。
     こうすると「次へ」のHTMLが、どの支店でも何ページ目でも一字一句同じになる。
        <a id="pgNext" href="#" onclick="return goNext();">次へ</a>
     最後のページでは a ではなく span になるので、
     「#pgNext がある間くり返す」でループの終了判定ができる。 */
  window.goFirst = function () { location.href = link(1); return false; };
  window.goPrev  = function () { location.href = link(page - 1); return false; };
  window.goNext  = function () { location.href = link(page + 1); return false; };
  window.goLast  = function () { location.href = link(maxPage); return false; };

  function navPart(cls, id, enabled, fn, label) {
    var inner = enabled
      ? '<a id="' + id + '" href="#" onclick="return ' + fn + '();">' + label + '</a>'
      : '<span class="pgoff">' + label + '</span>';
    return '<span class="' + cls + '">' + inner + '</span>';
  }
  function pagerHtml(withIds) {
    var i2 = function (n) { return withIds ? n : n + 'B'; };
    var nums = '';
    for (var i = 1; i <= maxPage; i++) {
      if (i === page) nums += '<span class="cur">' + i + '</span>';
      else nums += '<a href="' + link(i) + '">' + i + '</a>';
    }
    return navPart('pg-first', i2('pgFirst'), page > 1, 'goFirst', '&laquo;先頭') +
           navPart('pg-prev',  i2('pgPrev'),  page > 1, 'goPrev',  '前へ') +
           '<span class="pg-nums">' + nums + '</span>' +
           navPart('pg-next',  i2('pgNext'),  page < maxPage, 'goNext', '次へ') +
           navPart('pg-last',  i2('pgLast'),  page < maxPage, 'goLast', '最終&raquo;');
  }
  document.getElementById('pager1').innerHTML = pagerHtml(true);
  document.getElementById('pager2').innerHTML = pagerHtml(false);

  /* 見出しは thead、データは tbody に分ける。
     データ行は「どの支店でも・何ページ目でも・返品でも」まったく同じ形にする。
     tr に class は付けない。列の class も固定。返品は区分セルの中身だけが変わる。 */
  var h = '<thead><tr>' +
          '<th>No.</th><th>伝票番号</th><th>売上日</th><th>時刻</th><th>レジ</th>' +
          '<th>担当者</th><th>商品</th><th>点数</th><th>支払方法</th><th>金額（税込）</th><th>区分</th><th>&nbsp;</th>' +
          '</tr></thead><tbody>';
  for (var i = 0; i < view.length; i++) {
    var s = view[i];
    var qty = 0;
    for (var j = 0; j < s.lines.length; j++) qty += s.lines[j].qty;
    h += '<tr>' +
         '<td class="col-no">' + num(start + i + 1) + '</td>' +
         '<td class="col-id">' + s.id + '</td>' +
         '<td class="col-date">' + s.date + '</td>' +
         '<td class="col-time">' + s.time + '</td>' +
         '<td class="col-reg">' + s.register + '</td>' +
         '<td class="col-staff">' + s.staff + '</td>' +
         '<td class="col-item">' + lineSummary(s) + '</td>' +
         '<td class="col-qty">' + qty + '</td>' +
         '<td class="col-pay">' + s.payment + '</td>' +
         '<td class="col-amount">' + yen(s.total) + '</td>' +
         '<td class="col-status">' + s.status + '</td>' +
         '<td class="col-link"><a href="detail.html?id=' + s.id + '">詳細</a></td>' +
         '</tr>';
  }
  h += '</tbody>';
  if (view.length === 0) {
    h = '<thead><tr><th>No.</th><th>伝票番号</th><th>売上日</th><th>時刻</th><th>レジ</th>' +
        '<th>担当者</th><th>商品</th><th>点数</th><th>支払方法</th><th>金額（税込）</th><th>区分</th><th>&nbsp;</th></tr></thead>' +
        '<tbody></tbody>';
    document.getElementById('nodata').style.display = 'block';
  }
  document.getElementById('list').innerHTML = h;
}
</script>
</body>
</html>
