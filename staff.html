<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html lang="ja">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>スタッフ別売上 | メンタレジ 売上管理システム</title>
<link rel="stylesheet" href="assets/style.css">
<script>(function(){try{if(!sessionStorage.getItem('mreji_login'))location.replace('index.html');}catch(e){location.replace('index.html');}})();</script>
</head>
<body>
<div id="wrap">
<div id="header"></div>
<div id="gnav"></div>
<div id="main">

<div class="pankuzu">ホーム &gt; スタッフ別</div>
<h2 class="ttl">スタッフ別売上集計</h2>

<form action="staff.html" method="get">
<table class="search">
<tr><th>対象支店</th><td colspan="3" id="storecell"></td></tr>
<tr>
  <th>集計期間</th>
  <td colspan="3"><input type="text" name="from" id="from" size="12"> 〜 <input type="text" name="to" id="to" size="12">
      &nbsp;<input type="submit" class="btn" value="集 計"></td>
</tr>
</table>
</form>

<table class="list" id="list"></table>

<p style="font-size:11px;color:#888;">※売上金額は返品を差し引いた純売上です。<br>
※本集計はレジ担当者ベースです。勤怠システムの実績時間とは連動しておりません。</p>

</div>
<div id="footer"></div>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
var ME = requireLogin();
if (ME) {
  renderFrame('staff', ME);
  document.getElementById('storecell').innerHTML = storeBadge(ME.store);

  var cond = { from: getParam('from') || '2026-08-01', to: getParam('to') || '2026-08-31' };
  document.getElementById('from').value = cond.from;
  document.getElementById('to').value = cond.to;

  var rows = filterSales(cond, ME.store.code);
  var map = {};
  for (var i = 0; i < ME.store.staffs.length; i++) map[ME.store.staffs[i]] = { c: 0, u: 0, t: 0, q: 0 };
  for (var i = 0; i < rows.length; i++) {
    var s = rows[i];
    if (!map[s.staff]) continue;
    if (s.status !== '返品') map[s.staff].c++;
    map[s.staff].u += s.customers; map[s.staff].t += s.total;
    for (var j = 0; j < s.lines.length; j++) map[s.staff].q += s.lines[j].qty;
  }
  var list = [];
  for (var k in map) list.push({ name: k, v: map[k] });
  list.sort(function (a, b) { return b.v.t - a.v.t; });

  var h = '<thead><tr><th>店舗名</th><th>順位</th><th>担当者</th><th>伝票枚数</th><th>客数</th><th>売上金額</th><th>客単価</th><th>1枚あたり点数</th></tr></thead><tbody>';
  for (var i = 0; i < list.length; i++) {
    var r = list[i];
    h += '<tr>' +
         '<td class="col-store">' + ME.store.name + '</td>' +
         '<td class="col-rank">' + (i + 1) + '</td>' +
         '<td class="col-staff">' + r.name + '</td>' +
         '<td class="col-count">' + num(r.v.c) + '</td>' +
         '<td class="col-cust">' + num(r.v.u) + '</td>' +
         '<td class="col-amount">' + yen(r.v.t) + '</td>' +
         '<td class="col-avg">' + yen(Math.round(r.v.t / r.v.u)) + '</td>' +
         '<td class="col-perslip">' + (r.v.q / r.v.c).toFixed(1) + '</td></tr>';
  }
  h += '</tbody>';
  document.getElementById('list').innerHTML = h;
}
</script>
</body>
</html>
